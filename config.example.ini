; Plantilla de configuración. configurar.sh la copia a config.ini (que no se
; sube al repositorio). Datos del servidor según el anexo I del enunciado.
[oracle]
host = oracle0.ugr.es
puerto = 1521
servicio = practbd
; Tu usuario de Oracle (DNI sin la letra y con el primer dígito cambiado por x).
; La contraseña NO se guarda: se pide al arrancar.
usuario =
; Nombre con el que el driver ODBC de Oracle está registrado en el Driver Manager.
driver = OracleSeminario
